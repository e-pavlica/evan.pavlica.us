---
services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.7-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    labels:
      - 'com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy'
    restart: always

  letsencrypt:
    image: nginxproxy/acme-companion:2.6
    container_name: nginx-proxy-le
    depends_on:
      - nginx-proxy
    environment:
      - DEFAULT_EMAIL=epavlica@gmail.com
      - FILES_PERMS=644
      - FOLDERS_PERMS=755
    volumes_from:
      - nginx-proxy
    volumes:
      - acme:/etc/acme.sh
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  # Need to docker login ala the Makefile since this is a private image
  web:
    image: ghcr.io/e-pavlica/evan.pavlica.us:latest
    container_name: static-web
    depends_on:
      - nginx-proxy
      - letsencrypt
    expose:
      - 80
    environment:
      - VIRTUAL_HOST=evan.pavlica.us,pavlica.us,www.pavlica.us
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=evan.pavlica.us,pavlica.us,www.pavlica.us
      - LETSENCRYPT_EMAIL=epavlica@gmail.com
    restart: always

  # solid:
  #   image: nodesolidserver/node-solid-server:latest
  #   container_name: solid-server
  #   depends_on:
  #     - nginx-proxy
  #     - letsencrypt
  #   restart: always
  #   expose:
  #     - 8443

  #   volumes:
  #     # mount local directories to the container
  #     # (!) the host directories have to exist and be owned by UID 1000
  #     - /opt/solid/data:/opt/solid/data
  #     - /opt/solid/.db:/opt/solid/.db
  #     - /opt/solid/config:/opt/solid/config
  #     - certs:/opt/solid/certs:ro

  #   environment:
  #     # (!) use your actual SOLID_SERVER_URI
  #     - SOLID_SERVER_URI=https://j.pavlica.us
  #     - SOLID_MULTIUSER=true
  #     # (!) adjust path to the letsencrypt key and cert
  #     - SOLID_SSL_KEY=/opt/solid/certs/j.pavlica.us.key
  #     - SOLID_SSL_CERT=/opt/solid/certs/j.pavlica.us.crt
  #     # (!) use your actual host name
  #     - VIRTUAL_HOST=j.pavlica.us,evan.j.pavlica.us
  #     - VIRTUAL_PORT=8443
  #     - VIRTUAL_PROTO=https
  #     # (!) use your actual host name
  #     - LETSENCRYPT_HOST=j.pavlica.us,evan.j.pavlica.us
  #     - LETSENCRYPT_EMAIL=epavlica@gmail.com

  linkstack:
    image: linkstackorg/linkstack:latest
    environment:
      - TZ=America/Los_Angeles
      - SERVER_ADMIN=admin@pavlica.us
      - HTTP_SERVER_NAME=links.pavlica.us
      - HTTPS_SERVER_NAME=links.pavlica.us
      - LOG_LEVEL=info
      - PHP_MEMORY_LIMIT=512M
      - UPLOAD_MAX_FILESIZE=16M
      - VIRTUAL_HOST=links.pavlica.us
      - VIRTUAL_PORT=443
      - VIRTUAL_PROTO=https
      - LETSENCRYPT_HOST=links.pavlica.us
      - LETSENCRYPT_EMAIL=epavlica@gmail.com
    ports:
      - 443
    volumes:
      - linkstack:/htdocs
    restart: unless-stopped

volumes:
  acme:
  conf:
  vhost:
  html:
  dhparam:
  certs:
  linkstack:
